name: Actualizar precios diarios

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-catalog.yml"
      - "config/candidate-links.json"
      - "data/products.json"
      - "scripts/build_catalog.py"
      - "scripts/update_catalog.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "23 6 * * *"
      timezone: "America/Cancun"

permissions:
  contents: write

concurrency:
  group: update-catalog-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Investigar ligas y construir catálogo
        run: |
          python3 scripts/research_products.py \
            --config config/candidate-links.json \
            --output data/candidate-products.json \
            --workers 6 \
            --timeout 35 || echo "::warning::Algunas ligas no respondieron; se conservarán sus fichas verificadas anteriores."
          python3 scripts/build_catalog.py

      - name: Actualizar precios y disponibilidad
        run: npm run update-catalog

      - name: Validar catálogo
        run: |
          npm run test:catalog
          python3 -m unittest discover -s tests -v
          node --check app.js

      - name: Publicar cambios verificados
        run: |
          if git diff --quiet -- data/products.json; then
            echo "El catálogo no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "chore: actualizar catálogo diario"
          git push

name: Actualizar precios diarios

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
      timezone: "America/Cancun"

permissions:
  contents: write

concurrency:
  group: update-catalog-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar precios y disponibilidad
        run: npm run update-catalog

      - name: Validar catálogo
        run: |
          npm run test:catalog
          python3 -m unittest discover -s tests -v
          node --check app.js

      - name: Publicar cambios verificados
        run: |
          if git diff --quiet -- data/products.json; then
            echo "El catálogo no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "chore: actualizar precios diarios"
          git push
